name: integration

# Real-account integration suites. Dispatch only; never on pull requests. The
# account and region come from the protected `integration` environment, so the
# workflow itself stays universal. See tests/integration/README.md.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run.
        required: true
        default: smoke
        type: choice
        options:
          - smoke

permissions:
  contents: read
  id-token: write

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  integration:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-24.04
    environment: integration
    timeout-minutes: 45
    steps:
      - name: Check out revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false

      - name: Assume the integration role through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_INTEGRATION_ROLE_ARN }}
          role-session-name: aws-modules-cloudformation-integration
          aws-region: ${{ vars.AWS_INTEGRATION_REGION }}

      - name: Initialize without a remote backend
        run: terraform init -backend=false -input=false -test-directory=tests/integration -no-color

      - name: Run the ${{ inputs.suite }} suite
        run: terraform test -test-directory=tests/integration -filter="tests/integration/${{ inputs.suite }}.tftest.hcl" -no-color
